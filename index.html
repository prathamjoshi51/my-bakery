<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luxe Bakery</title>

<style>
* {margin:0; padding:0; box-sizing:border-box;}

body {
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: white;
}

/* NAV */
.nav {
    position: fixed;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 20px 50px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    z-index: 1000;
}

/* HERO */
.hero {
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1509440159596-0249088772ff') center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.hero h1 {
    font-size: 65px;
    animation: fadeIn 2s ease;
}

.btn {
    margin-top: 20px;
    padding: 15px 30px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(45deg,#ff4d6d,#ff9a9e);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px #ff4d6d;
}

/* MENU */
.menu {
    padding: 100px 20px;
    text-align: center;
}

.cards {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 40px;
}

.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
    background: #ff4d6d;
}

/* GALLERY */
.gallery {
    padding: 100px 20px;
    text-align: center;
}

.images {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

.images img {
    width: 250px;
    border-radius: 15px;
    transition: 0.3s;
}

.images img:hover {
    transform: scale(1.1);
}

/* ANIMATION */
.fade {
    opacity: 0;
    transform: translateY(40px);
    transition: 1s;
}

.fade.show {
    opacity: 1;
    transform: translateY(0);
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 20px;
    background: black;
}
</style>

</head>

<body>

<div class="nav">
    <div>🍰 Luxe Bakery</div>
    <div>Home | Menu | Gallery | Contact</div>
</div>

<div class="hero">
    <h1>Luxury Cake Experience</h1>
    <button class="btn">Order Now</button>
</div>

<div class="menu fade">
    <h2>Our Specials</h2>
    <div class="cards">
        <div class="card">Chocolate Cake ₹500</div>
        <div class="card">Red Velvet ₹700</div>
        <div class="card">Cupcakes ₹50</div>
    </div>
</div>

<div class="gallery fade">
    <h2>Gallery</h2>
    <div class="images">
        <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587">
        <img src="https://images.unsplash.com/photo-1559620192-032c4bc4674e">
        <img src="https://images.unsplash.com/photo-1608198093002-ad4e005484ec">
    </div>
</div>

<div class="footer">
    📞 9999999999
</div>

<script>
const faders = document.querySelectorAll('.fade');

window.addEventListener('scroll', () => {
    faders.forEach(el => {
        const rect = el.getBoundingClientRect();
        if(rect.top < window.innerHeight - 100){
            el.classList.add('show');
        }
    });
});
</script>

</body>
</html>
